<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroHand</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <h1>NeuroHand</h1>
    <nav id="tabs">
      <button data-mode="pinch" class="active">Пинцет</button>
      <button data-mode="grip">Эспандер</button>
      <button data-mode="hold">Перенос</button>
      <button id="btn-history" aria-controls="history">Мой прогресс</button>
      <button id="btn-results" aria-controls="results" aria-expanded="false">Итоги</button>
    </nav>
  </header>
  <main>
    <p id="storage-notice" role="status" aria-live="polite"></p>
    <p id="program-status">5 пинцетов → 5 сжатий → 3 цели по 2 секунды</p>
    <section id="stage">
      <h2 id="task-title">Собери 5 огоньков</h2>
      <p id="task-description">Соедини большой и указательный пальцы. Разведи их перед следующим захватом.</p>
      <div id="viewport">
        <video id="video" playsinline muted></video>
        <canvas id="canvas" aria-hidden="true"></canvas>
        <pre id="debug" hidden></pre>
      </div>
      <div id="score"></div>
      <div id="hint" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>
    <section id="panel">
      <label>Рука <select id="hand-choice"><option value="unspecified">Не выбрана</option><option value="left">Левая</option><option value="right">Правая</option></select></label>
      <button id="btn-start">Начать тренировку</button>
      <button id="btn-pause" disabled>Пауза</button>
      <button id="btn-calibrate" disabled hidden>Калибровка</button>
      <button id="btn-dump" hidden>Dump</button>
    </section>
    <section id="results" aria-label="Текущие итоги тренировки" hidden></section>
    <section id="history" aria-label="Мой прогресс" hidden></section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
